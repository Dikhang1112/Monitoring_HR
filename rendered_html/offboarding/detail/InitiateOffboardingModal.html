<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Initiate Employee Offboarding Proposal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090b;
            --bg-card: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --border-color: #e4e4e7;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }

        .modal-card {
            width: 100%; max-width: 640px; background: #ffffff; border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); overflow: hidden;
            display: flex; flex-direction: column;
        }

        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .modal-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; max-height: 75vh; overflow-y: auto; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-main); }
        .form-control {
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 13px; outline: none; background: #ffffff; color: var(--text-main); width: 100%;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .auto-email-badge {
            background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 14px;
            color: #16a34a; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 10px;
        }

        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); background: #fafafa; display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); }
        .btn-submit { padding: 9px 18px; border-radius: 8px; border: none; background: var(--primary); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>

<body>
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2 class="modal-title">Initiate Employee Offboarding Proposal</h2>
                <p class="modal-subtitle">Submit formal resignation or employment contract termination notice</p>
            </div>
        </div>

        <div class="modal-body">
            <div class="auto-email-badge">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                <span>📧 Autonomous Outlook Integration: Auto-dispatches email notification &amp; calendar sync to Manager &amp; HR Lead.</span>
            </div>

            <div class="form-group">
                <label class="form-label">Select Employee *</label>
                <select class="form-control">
                    <option selected="">Brandon Vance (Senior Systems Engineer • System Admin)</option>
                    <option>Emily Chen (Product UX Lead • Product Design)</option>
                    <option>Tu Nguyen (DevOps Engineer • Cloud Ops)</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Termination Category *</label>
                    <select class="form-control">
                        <option selected="">Voluntary Resignation</option>
                        <option>Contract Expiration</option>
                        <option>Involuntary Termination</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Working Day (LWD) *</label>
                    <input type="date" class="form-control" value="2026-08-31">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Primary Resignation Reason *</label>
                <select class="form-control">
                    <option selected="">Career Growth &amp; Promotion Opportunity</option>
                    <option>Compensation &amp; Benefits Expectations</option>
                    <option>Relocation / Personal Circumstance</option>
                    <option>Work-Life Balance</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Signed Resignation Letter / Agreement Document (PDF/DOC)</label>
                <input type="file" class="form-control">
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel">Cancel</button>
            <button class="btn-submit">Submit Offboarding Proposal</button>
        </div>
    </div>



</body></html>
