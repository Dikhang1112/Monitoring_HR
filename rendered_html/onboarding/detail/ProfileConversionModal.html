<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Candidate Profile Data Conversion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090b;
            --bg-card: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --border-color: #e4e4e7;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }

        .modal-card {
            width: 100%; max-width: 640px; background: #ffffff; border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); overflow: hidden;
            display: flex; flex-direction: column;
        }

        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .modal-subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; max-height: 75vh; overflow-y: auto; }

        .mapping-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-md); padding: 14px 16px; color: #16a34a; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-main); }
        .form-control {
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 13px; outline: none; background: #ffffff; color: var(--text-main); font-weight: 500;
        }
        .form-control:focus { border-color: var(--primary); }

        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); background: #fafafa; display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-main); }
        .btn-submit { padding: 9px 18px; border-radius: 8px; border: none; background: var(--primary); color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>

<body>
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2 class="modal-title">Convert Candidate to Employee Profile</h2>
                <p class="modal-subtitle">Review ATS field mapping and generate official employee directory entry</p>
            </div>
        </div>

        <div class="modal-body">
            <div class="mapping-box">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                <span>Duplicate Check Passed: No existing employee record found for alexander.wright@devmail.io</span>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">Employee Full Name</label>
                    <input type="text" class="form-control" value="Alexander Wright">
                </div>

                <div class="form-group">
                    <label class="form-label">System Generated Employee ID</label>
                    <input type="text" class="form-control" value="EMP-2026-089" readonly="" style="font-weight:700;">
                </div>

                <div class="form-group">
                    <label class="form-label">Official Work Email</label>
                    <input type="email" class="form-control" value="alexander.wright@company.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Job Title &amp; Level</label>
                    <input type="text" class="form-control" value="Senior Fullstack Engineer (L5)">
                </div>

                <div class="form-group">
                    <label class="form-label">Assigned Department</label>
                    <select class="form-control">
                        <option selected="">Software Engineering</option>
                        <option>System Administration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Direct Reporting Line Manager</label>
                    <select class="form-control">
                        <option selected="">Dao Vo (CTO)</option>
                        <option>Dung Nguyen (Head of SysAdmin)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Official Join Date</label>
                    <input type="date" class="form-control" value="2026-08-15">
                </div>

                <div class="form-group">
                    <label class="form-label">Monthly Gross Probation Salary ($ USD)</label>
                    <input type="text" class="form-control" value="$3,800 USD">
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel">Cancel</button>
            <button class="btn-submit">Generate Employee Directory Record</button>
        </div>
    </div>



</body></html>
