<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Job Requisition Form Modal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f4f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

        .modal-card {
            width: 100%; max-width: 640px; background: #ffffff; border: 1px solid #e4e4e7;
            border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden;
            display: flex; flex-direction: column;
        }

        .modal-header { padding: 20px 24px; border-bottom: 1px solid #e4e4e7; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 17px; font-weight: 700; color: #09090b; }
        .modal-subtitle { font-size: 12.5px; color: #71717a; margin-top: 2px; }

        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 13px; font-weight: 600; color: #09090b; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e4e4e7;
            font-size: 13px; color: #09090b; outline: none; background: #ffffff;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #09090b; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .modal-footer { padding: 16px 24px; border-top: 1px solid #e4e4e7; background: #fafafa; display: flex; justify-content: flex-end; gap: 12px; }
        .btn-cancel { padding: 9px 16px; border-radius: 8px; border: 1px solid #e4e4e7; background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: #09090b; }
        .btn-submit { padding: 9px 18px; border-radius: 8px; border: none; background: #09090b; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2 class="modal-title">Create Job Requisition</h2>
                <p class="modal-subtitle">Submit hiring proposal for Director and Finance Lead approval</p>
            </div>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Job Requisition Title *</label>
                <input type="text" class="form-input" value="Senior Cloud Infrastructure Engineer" placeholder="e.g. Senior Fullstack Engineer">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Hiring Department *</label>
                    <select class="form-select">
                        <option selected="">System Administration</option>
                        <option>Technology &amp; Software</option>
                        <option>People &amp; Culture (HR)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Hiring Manager Lead *</label>
                    <select class="form-select">
                        <option selected="">Dung Nguyen (Head of SysAdmin)</option>
                        <option>Dao Vo (CTO)</option>
                        <option>Lucia Doan (HR Manager)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Target Headcount Quota *</label>
                    <input type="number" class="form-input" value="2" min="1">
                </div>
                <div class="form-group">
                    <label class="form-label">Target Monthly Salary Range ($ USD) *</label>
                    <input type="text" class="form-input" value="$3,500 - $4,800 USD">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Job Description &amp; Requirements Summary</label>
                <textarea class="form-textarea" rows="3">Must have 5+ years of experience with Kubernetes, AWS Cloud Architecture, Terraform IaC, and CI/CD pipelines.</textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel">Save as Draft</button>
            <button class="btn-submit">Submit Requisition for Approval</button>
        </div>
    </div>


</body></html>
